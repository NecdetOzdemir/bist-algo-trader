<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIST Tarayıcı — Teknik Analiz</title>
    <meta name="description" content="BIST100 hisselerini gerçek zamanlı teknik analiz ile tara. Pivot noktaları, skor ve alım sinyalleri.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">📈</span>
                <span class="logo-text">BIST<b>Tarayıcı</b></span>
            </div>
            <div class="header-meta">
                <span class="delay-badge">⏱ 15 dk gecikmeli</span>
                <span id="scan-time" class="scan-time"></span>
            </div>
        </div>
    </header>

    <!-- CONTROLS -->
    <section class="controls">
        <div class="controls-inner">
            <!-- Tarama Butonu -->
            <button id="scanBtn" class="scan-btn" onclick="startScan()">
                <span class="btn-icon">🔍</span>
                <span class="btn-text">Sabah Taraması</span>
            </button>

            <!-- Bütçe -->
            <div class="budget-wrap">
                <label class="ctrl-label">💰 Bütçe (TL)</label>
                <input id="budgetInput" type="number" class="ctrl-input" placeholder="50000"
                    min="1000" step="1000" oninput="updateLots()">
            </div>

            <!-- Hisse Sayısı -->
            <div class="budget-wrap">
                <label class="ctrl-label">📦 Hisse Sayısı</label>
                <input id="slotInput" type="number" class="ctrl-input" placeholder="5"
                    min="1" max="20" step="1" value="5" oninput="updateLots()">
            </div>
        </div>

        <!-- Filtre Butonları -->
        <div class="filters" id="filters" style="display:none;">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">
                Tümü
            </button>
            <button class="filter-btn" data-filter="support" onclick="setFilter('support',this)">
                🟢 Destek Bölgesi
            </button>
            <button class="filter-btn" data-filter="pivot_above" onclick="setFilter('pivot_above',this)">
                ✅ Pivot Üstü
            </button>
            <button class="filter-btn" data-filter="strong" onclick="setFilter('strong',this)">
                ⚡ Güçlü Trend
            </button>
            <button class="filter-btn" data-filter="high_score" onclick="setFilter('high_score',this)">
                🏆 Skor ≥ 6
            </button>
        </div>
    </section>

    <!-- PROGRESS BAR -->
    <div id="progress-wrap" class="progress-wrap" style="display:none;">
        <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill" style="width:0%"></div>
        </div>
        <span id="progress-text" class="progress-text">Taranıyor...</span>
    </div>

    <!-- SUMMARY BAR -->
    <div id="summary-bar" class="summary-bar" style="display:none;">
        <span id="sum-total"></span>
        <span id="sum-support"></span>
        <span id="sum-high"></span>
    </div>

    <!-- RESULTS -->
    <main class="results" id="results"></main>

    <!-- EMPTY STATE -->
    <div id="empty-state" class="empty-state" style="display:none;">
        <div class="empty-icon">🔍</div>
        <p>Seçilen filtreye uygun hisse bulunamadı.</p>
        <small>Farklı bir filtre seçin veya yeniden tarayın.</small>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
